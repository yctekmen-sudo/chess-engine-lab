name: M7 desktop GUI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: |
            controller/package-lock.json
            gui/package-lock.json
      - name: Native engine and real controller
        run: |
          sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build
          cmake --preset native-debug
          cmake --build --preset native-debug
          npm --prefix controller ci --ignore-scripts
          npm --prefix controller run build
      - name: Locked UI dependencies and static checks
        run: |
          npm --prefix gui ci --ignore-scripts
          npm --prefix gui run typecheck
          npm --prefix gui run lint
          npm --prefix gui run build
      - name: React component and gateway tests
        run: npm --prefix gui test
      - name: Install pinned Playwright Chromium
        working-directory: gui
        run: npx playwright install --with-deps chromium
      - name: Real browser, loopback server and native engine
        working-directory: gui
        run: npm run e2e
