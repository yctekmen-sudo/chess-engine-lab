name: M6 headless controller
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: controller/package-lock.json
      - name: Native integration binaries
        run: |
          sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build
          cmake --preset native-debug
          cmake --build --preset native-debug
      - name: Install locked controller dependencies
        working-directory: controller
        run: npm ci --ignore-scripts
      - name: Typecheck and lint
        working-directory: controller
        run: npm run typecheck && npm run lint
      - name: Rules, clocks, UCI, recovery, and real CLI integration
        working-directory: controller
        run: npm test
